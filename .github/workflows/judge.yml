name: Judge
run-name: "评测 ${{ github.event.client_payload.player }} - ${{ github.event.client_payload.task }} (#${{ github.run_number }})"

on:
  repository_dispatch:
    types: [judge]

permissions:
  contents: read
  actions: write
  issues: write        # Comment result 步骤需要

concurrency:
  group: judge-${{ github.event.client_payload.submission_id || github.run_id }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml==6.0.2

      - name: Prepare source
        env:
          LANG_TYPE: ${{ github.event.client_payload.lang }}
          TASK: ${{ github.event.client_payload.task }}
          PLAYER: ${{ github.event.client_payload.player }}
          SOURCE_CONTENT: ${{ github.event.client_payload.source_content }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          set -euo pipefail

          # 校验参数
          if [ -z "$LANG_TYPE" ] || [ -z "$TASK" ] || [ -z "$PLAYER" ]; then
            echo "缺少必要参数: lang/task/player"
            exit 1
          fi

          if [ -z "$SOURCE_CONTENT" ]; then
            echo "source_content 为空"
            exit 1
          fi

          # 校验 task 和 player 只含安全字符，防止路径穿越
          if ! echo "$TASK" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "非法 task 名: $TASK"
            exit 1
          fi
          if ! echo "$PLAYER" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "非法 player 名: $PLAYER"
            exit 1
          fi

          mkdir -p /tmp/judge_src

          case "$LANG_TYPE" in
            cpp) EXT="cpp" ;;
            py)  EXT="py" ;;
            *)
              echo "不支持的语言: $LANG_TYPE"
              exit 1
              ;;
          esac

          # source_content 应为 base64 编码的源码
          echo "$SOURCE_CONTENT" | base64 -d > "/tmp/judge_src/main.$EXT"

          if [ ! -s "/tmp/judge_src/main.$EXT" ]; then
            echo "解码后源码为空"
            exit 1
          fi

          echo "SOURCE_FILE=/tmp/judge_src/main.$EXT" >> "$GITHUB_ENV"

      - name: Enable network isolation
        run: |
          set -euo pipefail
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which makes `unshare -n -r` fail with EPERM and would silently
          # disable the judge's network isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Fail loudly rather than judge submissions with network access.
          unshare -n -r true

      - name: Run judge
        env:
          PLAYER: ${{ github.event.client_payload.player }}
          TASK: ${{ github.event.client_payload.task }}
          LANG_TYPE: ${{ github.event.client_payload.lang }}
        run: |
          set -euo pipefail
          python scripts/run_tests.py \
            --lang "$LANG_TYPE" \
            --task "$TASK" \
            --source "$SOURCE_FILE" \
            --player "$PLAYER" \
            --out "out/result.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.event.client_payload.player }}-${{ github.event.client_payload.task }}-${{ github.run_number }}
          path: out/result.json
          retention-days: 7

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f out/result.json ]; then
            echo "结果文件不存在，跳过评论"
            exit 0
          fi

          VERDICT=$(python -c "import json; print(json.load(open('out/result.json'))['verdict'])")
          SCORE=$(python -c "import json; print(json.load(open('out/result.json'))['score'])")
          PLAYER=$(python -c "import json; print(json.load(open('out/result.json'))['player'])")
          TASK=$(python -c "import json; print(json.load(open('out/result.json'))['task'])")

          case "$VERDICT" in
            AC)  EMOJI="✅" ;;
            WA)  EMOJI="❌" ;;
            TLE) EMOJI="⏱️" ;;
            MLE) EMOJI="💾" ;;
            RE)  EMOJI="💥" ;;
            CE)  EMOJI="🔧" ;;
            IE)  EMOJI="⚠️" ;;
            *)   EMOJI="❓" ;;
          esac

          COMMENT="$EMOJI **$PLAYER** - $TASK: $VERDICT ($SCORE 分) | Run #${{ github.run_number }}"
          echo "$COMMENT"

          ISSUE_NUM="${{ github.event.client_payload.issue_number }}"
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            gh issue comment "$ISSUE_NUM" --body "$COMMENT" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f out/result.json ]; then
            echo "无结果文件，跳过摘要"
            exit 0
          fi
          {
            echo '```json'
            cat out/result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
