name: Judge

on:
  repository_dispatch:
    types: [judge]

permissions:
  contents: read
  actions: write

# 并发控制：同一选手同一题目不并行
concurrency:
  group: judge-${{ github.event.client_payload.player }}-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml==6.0.2

      - name: Prepare source

