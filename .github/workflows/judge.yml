name: Judge

on:
  repository_dispatch:
    types: [judge]

permissions:
  contents: read
  actions: write

# 并发控制：同一选手同一题目不并行
concurrency:
  group: judge-${{ github.event.client_payload.player }}-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml==6.0.2

      - name: Prepare source
        env:
          # 仅传递必要信息，不暴露 secrets
          PLAYER: ${{ github.event.client_payload.player }}
          TASK: ${{ github.event.client_payload.task }}
          LANG_TYPE: ${{ github.event.client_payload.lang }}
          SOURCE_CONTENT: ${{ github.event.client_payload.source }}
        run: |
          mkdir -p /tmp/judge_src
          # 根据语言确定文件扩展名
          if [ "$LANG_TYPE" = "cpp" ]; then
            EXT="cpp"
          elif [ "$LANG_TYPE" = "py" ]; then
            EXT="py"
          else
            echo "不支持的语言: $LANG_TYPE"
            exit 1
          fi
          # 将源码写入临时文件（base64 解码，避免特殊字符问题）
          echo "$SOURCE_CONTENT" | base64 -d > "/tmp/judge_src/main.$EXT"
          echo "SOURCE_FILE=/tmp/judge_src/main.$EXT" >> $GITHUB_ENV

      - name: Run judge
        env:
          PLAYER: ${{ github.event.client_payload.player }}
          TASK: ${{ github.event.client_payload.task }}
          LANG_TYPE: ${{ github.event.client_payload.lang }}
        run: |
          python scripts/run_tests.py \
            --lang "$LANG_TYPE" \
            --task "$TASK" \
            --source "$SOURCE_FILE" \
            --player "$PLAYER" \
            --out "out/result.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.event.client_payload.player }}-${{ github.event.client_payload.task }}
          path: out/result.json
          retention-days: 7

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f out/result.json ]; then
            echo "结果文件不存在，跳过评论"
            exit 0
          fi
          # 提取关键字段
          VERDICT=$(python -c "import json; print(json.load(open('out/result.json'))['verdict'])")
          SCORE=$(python -c "import json; print(json.load(open('out/result.json'))['score'])")
          PLAYER=$(python -c "import json; print(json.load(open('out/result.json'))['player'])")
          TASK=$(python -c "import json; print(json.load(open('out/result.json'))['task'])")

          # 构建评论
          if [ "$VERDICT" = "AC" ]; then
            EMOJI=""
          elif [ "$VERDICT" = "WA" ]; then
            EMOJI=""
          elif [ "$VERDICT" = "TLE" ]; then
            EMOJI="️"
          elif [ "$VERDICT" = "MLE" ]; then
            EMOJI=""
          elif [ "$VERDICT" = "RE" ]; then
            EMOJI=""
          elif [ "$VERDICT" = "CE" ]; then
            EMOJI=""
          else
            EMOJI=""
          fi

          COMMENT="$EMOJI **$PLAYER** - $TASK: $VERDICT ($SCORE 分)"
          echo "$COMMENT"

          # 如果有 dispatch 的 issue_number，则在对应 issue 下评论
          ISSUE_NUM="${{ github.event.client_payload.issue_number }}"
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            gh issue comment "$ISSUE_NUM" --body "$COMMENT" --repo "$GITHUB_REPOSITORY"
          fi
